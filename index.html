
<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luvira Jewels | Exclusive Jewellery</title>

<style>
:root{
  --black:#171512;
  --gold:#c8a45d;
  --cream:#faf8f3;
  --text:#29251f;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  color:var(--text);

}

header{
  background:var(--black);

  padding:24px 15px;

}

.logo{

  font-size:clamp(25px,5vw,38px);

}

.tagline{

  letter-spacing:3px;

}

.container{
  max-width:1400px;

}

.section-title{

  font-size:26px;
  margin:10px 0 22px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
  margin-bottom:25px;
}

.cat-btn{
  background:var(--black);
  color:var(--gold);
  border:1px solid var(--gold);
  padding:20px 8px;
  cursor:pointer;
  font-weight:bold;
  letter-spacing:1px;
  min-height:85px;
}

.cat-btn.active,
.cat-btn:hover{
  background:var(--gold);
  color:var(--black);
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin:25px 0;
  flex-wrap:wrap;
}

.toolbar h2{
  font-family:Georgia,serif;
  font-size:25px;
  margin:0;
}

.search{

  padding:13px;
  border:1px solid #d8d0c3;
  background:white;
  border-radius:5px;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
}

.product{
  background:white;
  border:1px solid #e9e5dc;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.product:hover{

}

.product-image{

  background:#f5f3ef;

  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

.product-image img{

  height:100%;
  object-fit:contain;
  position:absolute;
  inset:0;
}

.no-image{
  color:#a99b83;
  font-family:Georgia,serif;
  font-size:15px;
}

.product-info{
  padding:13px;
}

.product-info h3{
  font-family:Georgia,serif;
  font-size:17px;
  margin:0 0 8px;
}

.product-info p{
  font-size:12px;
  color:#777;
  margin:5px 0;
}

.product-info .category{

}

.view-btn{
  display:block;
  width:100%;
  margin-top:12px;
  background:var(--black);
  color:var(--gold);
  border:0;
  padding:11px;
  cursor:pointer;
}

.status{
  text-align:center;
  padding:35px 10px;
  color:#8a795b;
}

.pagination{

  justify-content:center;
  align-items:center;

  padding:30px 0;
}

.pagination button{
  padding:10px 20px;
  background:var(--black);
  color:var(--gold);
  border:0;
  cursor:pointer;
}

.pagination button:disabled{

}

footer{

  text-align:center;
  padding:25px 10px;

/* MODAL */

.modal{

  position:fixed;
  inset:0;
  z-index:1000;

  overflow-y:auto;
  padding:18px;

}

  position:relative;
  border-radius:10px;

}

.product-view .close{

  border:1px solid #e7dfcf;

<script>

/* =================================
   GOOGLE SHEETS CONNECTION
================================= */

const SHEETS = {

"Rings":"https://docs.google.com/spreadsheets/d/e/2PACX-1vTIUK_4obXBbYYtUc-99UspPpgSKowLEJcnCZy7kSfTkYO3QF16MWWWE34nE545rx3obmoloGKsJ9Bz/pub?gid=0&single=true&output=csv",

"Earrings":"https://docs.google.com/spreadsheets/d/e/2PACX-1vTIUK_4obXBbYYtUc-99UspPpgSKowLEJcnCZy7kSfTkYO3QF16MWWWE34nE545rx3obmoloGKsJ9Bz/pub?gid=547971000&single=true&output=csv",

"Pendants":"https://docs.google.com/spreadsheets/d/e/2PACX-1vTIUK_4obXBbYYtUc-99UspPpgSKowLEJcnCZy7kSfTkYO3QF16MWWWE34nE545rx3obmoloGKsJ9Bz/pub?gid=318107255&single=true&output=csv",

"Necklaces":"https://docs.google.com/spreadsheets/d/e/2PACX-1vTIUK_4obXBbYYtUc-99UspPpgSKowLEJcnCZy7kSfTkYO3QF16MWWWE34nE545rx3obmoloGKsJ9Bz/pub?gid=1426609771&single=true&output=csv",

"Bracelets":"https://docs.google.com/spreadsheets/d/e/2PACX-1vTIUK_4obXBbYYtUc-99UspPpgSKowLEJcnCZy7kSfTkYO3QF16MWWWE34nE545rx3obmoloGKsJ9Bz/pub?gid=121305611&single=true&output=csv"

};

const MEDIA_API="https://script.google.com/macros/s/AKfycbxUrGRyZzOG_8ca0jF1bAE0U1X5KzCuZWWWeQUD2gkN-vZZKA0iyGxChdD3RDz8LKAkpA/exec";

const mediaCache=new Map();


/* =================================
   MEDIA API
================================= */

function fetchProductMedia(folderUrl){

  folderUrl=String(folderUrl||"").trim();

  if(!folderUrl){
    return Promise.resolve({
      success:true,
      images:[],
      videos:[]
    });
  }

  if(mediaCache.has(folderUrl)){
    return mediaCache.get(folderUrl);
  }

  const request=new Promise((resolve,reject)=>{

    const callbackName=
      "luvMedia_"+Date.now()+"_"+Math.floor(Math.random()*1000000);

    const script=document.createElement("script");

    let finished=false;
    let timeout;

    const cleanup=()=>{

      if(finished)return;

      finished=true;

      clearTimeout(timeout);

      delete window[callbackName];

      script.remove();

    };

    timeout=setTimeout(()=>{

      cleanup();

      mediaCache.delete(folderUrl);

      reject(new Error("Media API timed out"));

    },60000);

    window[callbackName]=data=>{

      if(finished)return;

      cleanup();

      if(data&&data.success){

        resolve(data);

      }else{

        mediaCache.delete(folderUrl);

        reject(new Error((data&&data.error)||"Media API failed"));

      }

    };

    script.onerror=()=>{

      if(finished)return;

      cleanup();

      mediaCache.delete(folderUrl);

      reject(new Error("Could not connect to media API"));

    };

    script.src=
      MEDIA_API+
      "?folder="+encodeURIComponent(folderUrl)+
      "&callback="+encodeURIComponent(callbackName)+
      "&_="+Date.now();

    document.head.appendChild(script);

  });

  mediaCache.set(folderUrl,request);

  return request;

}


/* =================================
   GOOGLE DRIVE HELPERS
================================= */

function getDriveFileId(item){

  if(!item)return "";

  if(item.id)return String(item.id).trim();

  if(item.fileId)return String(item.fileId).trim();

  const url=String(item.url||"");

  const patterns=[
    /\/file\/d\/([a-zA-Z0-9_-]+)/,
    /[?&]id=([a-zA-Z0-9_-]+)/,
    /\/d\/([a-zA-Z0-9_-]+)/
  ];

  for(const pattern of patterns){

    const match=url.match(pattern);

    if(match)return match[1];

  }

  return "";

}


function loadDriveImage(img,item,onFail){

  const id=getDriveFileId(item);

  const candidates=[];

  if(item&&item.url){
    candidates.push(String(item.url).trim());
  }

  if(id){

    candidates.push(
      "https://lh3.googleusercontent.com/d/"+id+"=w1200"
    );

    candidates.push(
      "https://drive.google.com/thumbnail?id="+id+"&sz=w1200"
    );

    candidates.push(
      "https://drive.google.com/uc?export=view&id="+id
    );

  }

  const urls=[...new Set(candidates.filter(Boolean))];

  let index=0;

  img.onerror=()=>{

    index++;

    if(index<urls.length){

      img.src=urls[index];

    }else{

      img.onerror=null;

      if(typeof onFail==="function"){
        onFail();
      }else{
        img.remove();
      }

    }

  };

  if(urls.length){

    img.src=urls[0];

  }else if(typeof onFail==="function"){

    onFail();

  }else{

    img.remove();

  }

}


function getDriveVideoUrl(item){

  const id=getDriveFileId(item);

  if(id){

    return "https://drive.google.com/file/d/"+id+"/preview";

  }

  return item&&item.url?String(item.url):"";

}


/* =================================
   GENERAL HELPERS
================================= */

function escapeHTML(value){

  return String(value==null?"":value).replace(/[&<>"']/g,char=>({

    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"

  })[char]);

}

function makeSafeText(value){

  return escapeHTML(
    value==null||value===""?"-":value
  );

}


/* =================================
   CSV PARSER
================================= */

function parseCSV(text){

  const rows=[];

  let row=[];
  let cell="";
  let quoted=false;

  for(let i=0;i<text.length;i++){

    const c=text[i];

    if(c==='"'){

      if(quoted&&text[i+1]==='"'){

        cell+='"';
        i++;

      }else{

        quoted=!quoted;

      }

    }else if(c===','&&!quoted){

      row.push(cell);
      cell="";

    }else if((c==='\n'||c==='\r')&&!quoted){

      if(c==='\r'&&text[i+1]==='\n')i++;

      row.push(cell);

      if(row.some(v=>v.trim()!=="")){
        rows.push(row);
      }

      row=[];
      cell="";

    }else{

      cell+=c;

    }

  }

  row.push(cell);

  if(row.some(v=>v.trim()!=="")){
    rows.push(row);
  }

  return rows;

}


/* =================================
   LOAD PRODUCT DATA
================================= */

let allProducts=[];

let currentCategory="All Products";

let currentPage=1;

const perPage=12;


async function loadProducts(){

  const status=document.getElementById("status");

  try{

    const results=await Promise.all(

      Object.entries(SHEETS).map(async([category,url])=>{

        const response=await fetch(url);

        if(!response.ok){

          throw new Error("Unable to load "+category);

        }

        const csv=await response.text();

        const rows=parseCSV(csv);

        return rows.slice(1)

          .filter(r=>r[0]&&r[0].trim())

          .map(r=>({

            code:r[0]||"",
            name:r[1]||"",
            description:r[2]||"",
            material:r[3]||"",
            metalWeight:r[4]||"",
            diamondWeight:r[5]||"",
            size:r[6]||"",
            imageFolder:r[7]||"",
            videoFolder:r[8]||"",
            category

          }));

      })

    );

    allProducts=results.flat();

    status.style.display="none";

    renderProducts();

  }catch(error){

    status.textContent=
      "Unable to load products. Please check Google Sheets publishing settings.";

    console.error(error);

  }

}


/* =================================
   PRODUCT LIST
================================= */

function renderProducts(){

  const grid=document.getElementById("products");

  const search=
    document.getElementById("search").value.toLowerCase();

  const filtered=allProducts.filter(p=>{

    const categoryMatch=
      currentCategory==="All Products"||
      p.category===currentCategory;

    const searchMatch=
      (p.name+" "+p.code+" "+p.category)
      .toLowerCase()
      .includes(search);

    return categoryMatch&&searchMatch;

  });

  const totalPages=Math.max(
    1,
    Math.ceil(filtered.length/perPage)
  );

  currentPage=Math.min(currentPage,totalPages);

  const start=(currentPage-1)*perPage;

  const pageProducts=
    filtered.slice(start,start+perPage);

  document.getElementById("heading").textContent=
    currentCategory;

  grid.innerHTML="";

  if(!filtered.length){

    grid.innerHTML=
      '<div class="status" style="grid-column:1/-1">No products found.</div>';

  }

  pageProducts.forEach(p=>{

    const card=document.createElement("div");

    card.className="product";

    const image=document.createElement("div");

    image.className="product-image";

    const placeholder=document.createElement("span");

    placeholder.className="no-image";

    placeholder.textContent="LUVIRA JEWELS";

    image.appendChild(placeholder);

    if(p.imageFolder){

      fetchProductMedia(p.imageFolder)

        .then(media=>{

          if(!media.images||!media.images.length)return;

          const img=document.createElement("img");

          img.alt=p.name||p.code||"Luvira jewellery";

          img.loading="lazy";

          img.decoding="async";

          img.referrerPolicy="no-referrer";

          img.onload=()=>placeholder.remove();

          image.appendChild(img);

          loadDriveImage(img,media.images[0],()=>img.remove());

        })

        .catch(error=>{

          console.warn("Image load:",p.code,error);

        });

    }

    const info=document.createElement("div");

    info.className="product-info";

    const name=document.createElement("h3");

    name.textContent=p.name;

    const code=document.createElement("p");

    code.textContent="Product Code: "+p.code;

    const category=document.createElement("p");

    category.className="category";

    category.textContent=p.category;

    const btn=document.createElement("button");

    btn.className="view-btn";

    btn.textContent="View Details";

    btn.addEventListener("click",e=>{

      e.stopPropagation();

      openProduct(p);

    });

    info.append(name,code,category,btn);

    card.append(image,info);

    card.addEventListener("click",()=>openProduct(p));

    grid.appendChild(card);

  });

  const pagination=document.getElementById("pagination");

  pagination.style.display=filtered.length?"flex":"none";

  document.getElementById("page").textContent=
    `Page ${currentPage} of ${totalPages}`;

  document.getElementById("prev").disabled=
    currentPage===1;

  document.getElementById("next").disabled=
    currentPage===totalPages;

}


/* =================================
   PRODUCT GALLERY STATE
================================= */

let activeProductMedia={

  product:null,

  images:[],

  videos:[],

  colourGroups:{},

  videosByColour:{},

  colour:"",

  mobileImageIndex:0,

  mobileTab:"images"

};


const PRODUCT_COLOURS={

  YL:{
    label:"Yellow Gold",
    swatch:"swatch-yl"
  },

  WH:{
    label:"White Gold",
    swatch:"swatch-wh"
  },

  RS:{
    label:"Rose Gold",
    swatch:"swatch-rs"
  },

  PT:{
    label:"Platinum",
    swatch:"swatch-pt"
  }

};


function getImageColour(filename){

  const name=String(filename||"").toUpperCase();

  const match=name.match(
    /-(YL|WH|RS|PT)(?:[-_.]|$)/
  );

  return match?match[1]:"OTHER";

}


/* =================================
   SELECTED COLOUR MEDIA
================================= */

function getSelectedImages(){

  return activeProductMedia.colourGroups[
    activeProductMedia.colour
  ]||[];

}


function getSelectedVideos(){

  const colour=
    activeProductMedia.videosByColour[
      activeProductMedia.colour
    ]||[];

  const general=
    activeProductMedia.videosByColour.OTHER||[];

  return colour.length?colour:general;

}


/* =================================
   COLOUR BUTTONS
================================= */

function renderColourButtons(){

  return Object.keys(activeProductMedia.colourGroups)

    .filter(code=>
      code!=="OTHER"&&
      activeProductMedia.colourGroups[code].length
    )

    .map(code=>{

      const meta=PRODUCT_COLOURS[code]||{

        label:code,

        swatch:"swatch-pt"

      };

      return `

        <button
          type="button"
          class="colour-btn ${
            activeProductMedia.colour===code?"active":""
          }"
          data-colour="${code}"
        >

          <span class="colour-swatch ${meta.swatch}"></span>

          ${meta.label}

        </button>

      `;

    }).join("");

}


/* =================================
   PRODUCT DETAILS HTML
================================= */

function renderDetails(){

  const p=activeProductMedia.product;

  const fields=[

    ["Product Name",p.name],

    ["Product Code",p.code],

    ["Category",p.category],

    ["Description",p.description],

    ["Material",p.material],

    ["Metal Weight",p.metalWeight],

    ["Diamond Weight",p.diamondWeight],

    ["Size",p.size]

  ];

  return `

    <section class="product-details">

      <h3>Product Details</h3>

      <div class="details-grid">

        ${fields.map(([label,value])=>`

          <div class="detail-item">

            <strong>${label}</strong>

            <span>${makeSafeText(value)}</span>

          </div>

        `).join("")}

      </div>

    </section>

  `;

}


/* =================================
   MOBILE IMAGE GALLERY
================================= */

function renderMobileImages(){

  const images=getSelectedImages();

  const index=activeProductMedia.mobileImageIndex;

  const current=images[index]||null;

  let dots="";

  images.forEach((img,i)=>{

    dots+=`

      <button

        type="button"

        class="mobile-dot ${i===index?"active":""}"

        data-dot="${i}"

        aria-label="View image ${i+1}"

      ></button>

    `;

  });

  return `

    <div class="mobile-image-stage">

      ${
        current
        ? `<img id="mobile-main-image" alt="${makeSafeText(activeProductMedia.product.name)}">`
        : `<div class="media-placeholder">No images available for this colour.</div>`
      }

      ${
        images.length>1
        ? `

          <button
            type="button"
            class="mobile-arrow prev"
            id="mobile-prev"
            aria-label="Previous image"
          >‹</button>

          <button
            type="button"
            class="mobile-arrow next"
            id="mobile-next"
            aria-label="Next image"
          >›</button>

        `
        : ""
      }

    </div>

    <div class="mobile-dots">

      ${dots}

    </div>

  `;

}


/* =================================
   MOBILE VIDEO GALLERY
================================= */

function renderMobileVideos(){

  const videos=getSelectedVideos();

  if(!videos.length){

    return `

      <div class="mobile-empty">
        No videos available for this colour.
      </div>

    `;

  }

  return `

    <div class="mobile-video-grid">

      ${videos.map((video,index)=>`

        <div class="mobile-video-card">

          <iframe

            src="${escapeHTML(getDriveVideoUrl(video))}"

            title="Product video ${index+1}"

            loading="lazy"

            allow="autoplay; encrypted-media; picture-in-picture"

            allowfullscreen

          ></iframe>

        </div>

      `).join("")}

    </div>

  `;

}


/* =================================
   DESKTOP GALLERY
================================= */

function renderDesktopGallery(){

  const images=getSelectedImages();

  const videos=getSelectedVideos();

  const ordered=[];

  // First image

  if(images.length){

    ordered.push({

      type:"image",

      item:images[0]

    });

  }

  // First two videos

  videos.slice(0,2).forEach(video=>{

    ordered.push({

      type:"video",

      item:video

    });

  });

  // Remaining images

  images.slice(1).forEach(img=>{

    ordered.push({

      type:"image",

      item:img

    });

  });

  if(!ordered.length){

    return `

      <div class="media-placeholder">
        No product media available.
      </div>

    `;

  }

  return ordered.map((media,index)=>{

    if(media.type==="image"){

      return `

        <div class="desktop-media">

          <img

            data-desktop-image="${index}"

            alt="${makeSafeText(activeProductMedia.product.name)}"

            loading="${index<3?"eager":"lazy"}"

          >

        </div>

      `;

    }

    return `

      <div class="desktop-media">

        <iframe

          src="${escapeHTML(getDriveVideoUrl(media.item))}"

          title="Product video"

          loading="lazy"

          allow="autoplay; encrypted-media; picture-in-picture"

          allowfullscreen

        ></iframe>

        <span class="video-label">PRODUCT VIDEO</span>

      </div>

    `;

  }).join("");

}


/* =================================
   MAIN PRODUCT GALLERY RENDER
================================= */

function renderProductGallery(){

  const p=activeProductMedia.product;

  const content=document.getElementById("modal-content");

  const images=getSelectedImages();

  const videos=getSelectedVideos();

  const colourButtons=renderColourButtons();

  const details=renderDetails();

  content.innerHTML=`

    <div class="product-layout">

      <!-- DESKTOP GALLERY -->

      <div class="desktop-gallery">

        ${renderDesktopGallery()}

      </div>


      <!-- MOBILE GALLERY -->

      <div class="mobile-gallery">

        <div id="mobile-image-view">

          ${renderMobileImages()}

        </div>

        <div class="mobile-tabs">

          <button

            type="button"

            class="mobile-tab ${
              activeProductMedia.mobileTab==="images"?"active":""
            }"

            data-tab="images"

          >

            <span>▧</span>

            Images

          </button>

          <button

            type="button"

            class="mobile-tab ${
              activeProductMedia.mobileTab==="videos"?"active":""
            }"

            data-tab="videos"

          >

            <span>▷</span>

            Videos

          </button>

        </div>

        <div class="mobile-tab-content" id="mobile-tab-content">

          ${
            activeProductMedia.mobileTab==="images"
            ? ""
            : renderMobileVideos()
          }

        </div>

      </div>


      <!-- PRODUCT INFORMATION -->

      <aside class="product-sidebar">

        <div class="gallery-kicker">
          Luvira Jewels
        </div>

        <h2>${makeSafeText(p.name||p.code)}</h2>

        <p>

          <strong>Product Code:</strong>

          ${makeSafeText(p.code)}

        </p>

        <p>

          <strong>Category:</strong>

          ${makeSafeText(p.category)}

        </p>

        <p>${makeSafeText(p.description)}</p>


        <div class="colour-title">
          Choose your colour
        </div>

        <div class="colour-options">

          ${
            colourButtons||
            '<span class="gallery-note">No colour options available.</span>'
          }

        </div>

        <p class="gallery-note">

          Select a colour to view its matching product images and videos.

        </p>


        <!-- DETAILS ON RIGHT SIDE / BELOW ON MOBILE -->

        ${details}

      </aside>

    </div>

  `;


  /* LOAD DESKTOP IMAGES */

  const desktopOrdered=[];

  if(images.length){

    desktopOrdered.push({

      item:images[0],

      type:"image"

    });

  }

  videos.slice(0,2).forEach(video=>{

    desktopOrdered.push({

      item:video,

      type:"video"

    });

  });

  images.slice(1).forEach(img=>{

    desktopOrdered.push({

      item:img,

      type:"image"

    });

  });


  desktopOrdered.forEach((media,index)=>{

    if(media.type!=="image")return;

    const img=content.querySelector(

      `[data-desktop-image="${index}"]`

    );

    if(img){

      img.referrerPolicy="no-referrer";

      loadDriveImage(img,media.item,()=>{

        const card=img.closest(".desktop-media");

        if(card){

          card.innerHTML=

            '<div class="media-placeholder">Image unavailable</div>';

        }

      });

    }

  });


  /* LOAD MOBILE MAIN IMAGE */

  loadMobileMainImage();


  /* MOBILE DOT EVENTS */

  content.querySelectorAll("[data-dot]").forEach(button=>{

    button.addEventListener("click",()=>{

      activeProductMedia.mobileImageIndex=
        Number(button.dataset.dot);

      renderMobileImageView();

    });

  });


  /* MOBILE ARROWS */

  const prev=document.getElementById("mobile-prev");

  const next=document.getElementById("mobile-next");


  if(prev){

    prev.onclick=()=>{

      if(activeProductMedia.mobileImageIndex>0){

        activeProductMedia.mobileImageIndex--;

        renderMobileImageView();

      }

    };

  }


  if(next){

    next.onclick=()=>{

      if(
        activeProductMedia.mobileImageIndex<
        images.length-1
      ){

        activeProductMedia.mobileImageIndex++;

        renderMobileImageView();

      }

    };

  }


  /* MOBILE TABS */

  content.querySelectorAll("[data-tab]").forEach(button=>{

    button.addEventListener("click",()=>{

      activeProductMedia.mobileTab=button.dataset.tab;

      renderMobileTab();

    });

  });


  /* COLOUR SELECTION */

  content.querySelectorAll("[data-colour]").forEach(button=>{

    button.addEventListener("click",()=>{

      activeProductMedia.colour=button.dataset.colour;

      activeProductMedia.mobileImageIndex=0;

      activeProductMedia.mobileTab="images";

      renderProductGallery();

    });

  });

}


/* =================================
   LOAD MOBILE MAIN IMAGE
================================= */

function loadMobileMainImage(){

  const images=getSelectedImages();

  const current=images[
    activeProductMedia.mobileImageIndex
  ];

  const img=document.getElementById("mobile-main-image");

  if(img&&current){

    img.referrerPolicy="no-referrer";

    loadDriveImage(img,current,()=>{

      const stage=img.closest(".mobile-image-stage");

      if(stage){

        stage.innerHTML=

          '<div class="media-placeholder">Image unavailable</div>';

      }

    });

  }

}


/* =================================
   RENDER MOBILE IMAGE VIEW
================================= */

function renderMobileImageView(){

  const box=document.getElementById("mobile-image-view");

  if(!box)return;

  box.innerHTML=renderMobileImages();

  loadMobileMainImage();


  const images=getSelectedImages();

  const prev=document.getElementById("mobile-prev");

  const next=document.getElementById("mobile-next");


  if(prev){

    prev.disabled=
      activeProductMedia.mobileImageIndex===0;

    prev.onclick=()=>{

      if(activeProductMedia.mobileImageIndex>0){

        activeProductMedia.mobileImageIndex--;

        renderMobileImageView();

      }

    };

  }


  if(next){

    next.disabled=
      activeProductMedia.mobileImageIndex===images.length-1;

    next.onclick=()=>{

      if(
        activeProductMedia.mobileImageIndex<
        images.length-1
      ){

        activeProductMedia.mobileImageIndex++;

        renderMobileImageView();

      }

    };

  }


  box.querySelectorAll("[data-dot]").forEach(button=>{

    button.addEventListener("click",()=>{

      activeProductMedia.mobileImageIndex=
        Number(button.dataset.dot);

      renderMobileImageView();

    });

  });

}


/* =================================
   RENDER MOBILE TABS
================================= */

function renderMobileTab(){

  const content=document.getElementById("modal-content");

  const tabContent=document.getElementById("mobile-tab-content");

  if(!content||!tabContent)return;

  content.querySelectorAll("[data-tab]").forEach(button=>{

    button.classList.toggle(

      "active",

      button.dataset.tab===activeProductMedia.mobileTab

    );

  });


  if(activeProductMedia.mobileTab==="images"){

    tabContent.innerHTML="";

    const imageBox=document.getElementById("mobile-image-view");

    if(imageBox){

      imageBox.style.display="block";

    }

  }else{

    const imageBox=document.getElementById("mobile-image-view");

    if(imageBox){

      imageBox.style.display="none";

    }

    tabContent.innerHTML=renderMobileVideos();

  }

}


/* =================================
   OPEN PRODUCT
================================= */

async function openProduct(p){

  const modal=document.getElementById("modal");

  const content=document.getElementById("modal-content");


  activeProductMedia={

    product:p,

    images:[],

    videos:[],

    colourGroups:{},

    videosByColour:{},

    colour:"",

    mobileImageIndex:0,

    mobileTab:"images"

  };


  modal.style.display="block";

  modal.setAttribute("aria-hidden","false");

  document.body.style.overflow="hidden";


  content.innerHTML=

    '<div class="status">Loading product photos and videos...</div>';


  try{

    const results=await Promise.allSettled([

      fetchProductMedia(p.imageFolder),

      fetchProductMedia(p.videoFolder)

    ]);


    const imageData=

      results[0].status==="fulfilled"

      ?results[0].value

      :{images:[]};


    const videoData=

      results[1].status==="fulfilled"

      ?results[1].value

      :{videos:[]};


    activeProductMedia.images=
      imageData.images||[];

    activeProductMedia.videos=
      videoData.videos||[];


    /* GROUP VIDEOS BY COLOUR */

    activeProductMedia.videos.forEach(item=>{

      const code=getImageColour(item.name);

      if(!activeProductMedia.videosByColour[code]){

        activeProductMedia.videosByColour[code]=[];

      }

      activeProductMedia.videosByColour[code].push(item);

    });


    /* GROUP IMAGES BY COLOUR */

    activeProductMedia.images.forEach(item=>{

      const code=getImageColour(item.name);

      if(!activeProductMedia.colourGroups[code]){

        activeProductMedia.colourGroups[code]=[];

      }

      activeProductMedia.colourGroups[code].push(item);

    });


    /* SELECT DEFAULT COLOUR */

    const available=Object.keys(

      activeProductMedia.colourGroups

    ).filter(code=>code!=="OTHER");


    activeProductMedia.colour=

      ["YL","WH","RS","PT"].find(

        code=>available.includes(code)

      )

      ||available[0]

      ||"OTHER";


    if(
      !available.length&&
      activeProductMedia.images.length
    ){

      activeProductMedia.colourGroups.OTHER=
        activeProductMedia.images;

      activeProductMedia.colour="OTHER";

    }


    renderProductGallery();


  }catch(error){

    console.error("Product media error:",error);

    content.innerHTML=

      '<div class="status">Unable to load product media. Please refresh and try again.</div>';

  }

}


/* =================================
   CATEGORY FILTER
================================= */

document.querySelectorAll(".cat-btn").forEach(btn=>{

  btn.addEventListener("click",()=>{

    document.querySelectorAll(".cat-btn").forEach(b=>{

      b.classList.remove("active");

    });

    btn.classList.add("active");

    currentCategory=btn.dataset.cat;

    currentPage=1;

    renderProducts();

  });

});


/* =================================
   SEARCH
================================= */

document.getElementById("search").addEventListener("input",()=>{

  currentPage=1;

  renderProducts();

});


/* =================================
   PAGINATION
================================= */

document.getElementById("prev").onclick=()=>{

  if(currentPage>1){

    currentPage--;

    renderProducts();

    window.scrollTo({

      top:0,

      behavior:"smooth"

    });

  }

};


document.getElementById("next").onclick=()=>{

  currentPage++;

  renderProducts();

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

};


/* =================================
   CLOSE PRODUCT
================================= */

function closeProductModal(){

  const modal=document.getElementById("modal");

  modal.style.display="none";

  modal.setAttribute("aria-hidden","true");

  document.body.style.overflow="";

}


document.getElementById("close").onclick=
  closeProductModal;


document.getElementById("modal").onclick=e=>{

  if(e.target.id==="modal"){

    closeProductModal();

  }

};


document.addEventListener("keydown",e=>{

  if(e.key==="Escape"){

    closeProductModal();

  }

});


/* =================================
   START WEBSITE
================================= */

loadProducts();

</script>
