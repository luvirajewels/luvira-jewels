
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171512">
<title>Luvira Jewels | Exclusive Jewellery</title>

<style>
:root {
  --black:#171512;
  --gold:#c8a45d;
  --cream:#faf8f3;
  --text:#29251f;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  color:var(--text);
  font-family:Arial,sans-serif;
}

header{
  background:var(--black);
  color:white;
  text-align:center;
  padding:24px 15px;
  border-bottom:3px solid var(--gold);
}

.logo{
  font-family:Georgia,serif;
  font-size:clamp(25px,5vw,38px);
  font-weight:bold;
  letter-spacing:5px;
}

.tagline{
  color:var(--gold);
  font-size:11px;
  letter-spacing:3px;
  margin-top:9px;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:25px 18px;
}

.section-title{
  font-family:Georgia,serif;
  font-size:26px;
  margin:10px 0 22px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
  margin-bottom:25px;
}

.cat-btn{
  background:var(--black);
  color:var(--gold);
  border:1px solid var(--gold);
  padding:20px 8px;
  cursor:pointer;
  font-weight:bold;
  letter-spacing:1px;
  min-height:85px;
  transition:.2s;
}

.cat-btn.active,.cat-btn:hover{
  background:var(--gold);
  color:var(--black);
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin:25px 0;
  flex-wrap:wrap;
}

.toolbar h2{
  font-family:Georgia,serif;
  font-size:25px;
  margin:0;
}

.search{
  width:min(100%,320px);
  padding:13px;
  border:1px solid #d8d0c3;
  background:white;
  border-radius:5px;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
}

.product{
  background:white;
  border:1px solid #e9e5dc;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.product:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 25px #00000012;
}

.product-image{
  width:100%;
  aspect-ratio:1/1;
  background:#f5f3ef;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.no-image{
  color:#a99b83;
  font-family:Georgia,serif;
  font-size:15px;
}

.product-info{
  padding:13px;
}

.product-info h3{
  font-family:Georgia,serif;
  font-size:17px;
  margin:0 0 8px;
}

.product-info p{
  font-size:12px;
  color:#777;
  margin:5px 0;
}

.product-info .category{
  color:#a17b36;
}

.view-btn{
  display:block;
  width:100%;
  margin-top:12px;
  background:var(--black);
  color:var(--gold);
  border:0;
  padding:11px;
  cursor:pointer;
}

.status{
  text-align:center;
  padding:35px 10px;
  color:#8a795b;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  padding:30px 0;
}

.pagination button{
  padding:10px 20px;
  background:var(--black);
  color:var(--gold);
  border:0;
  cursor:pointer;
}

.pagination button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  background:#000b;
  overflow-y:auto;
  padding:20px;
}

.modal-box{
  background:white;
  max-width:650px;
  margin:30px auto;
  padding:25px;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:12px;
  font-size:28px;
  cursor:pointer;
}

.modal h2{
  font-family:Georgia,serif;
  padding-right:25px;
}

.modal p{
  line-height:1.7;
  font-size:14px;
}

.folder-link{
  display:inline-block;
  margin:8px 5px 8px 0;
  background:var(--black);
  color:var(--gold);
  padding:12px 16px;
  text-decoration:none;
  font-size:13px;
}

footer{
  background:var(--black);
  color:#c7b58e;
  text-align:center;
  padding:25px 10px;
  margin-top:35px;
  font-size:12px;
  letter-spacing:1px;
}

@media(max-width:700px){
  .container{padding:18px 12px}
  .logo{letter-spacing:3px}
  .categories{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
  }
  .cat-btn{
    min-height:65px;
    padding:12px 4px;
    font-size:11px;
    letter-spacing:.5px;
  }
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }
  .product-info{padding:9px}
  .product-info h3{font-size:14px}
  .product-info p{font-size:11px}
  .toolbar{gap:12px}
  .toolbar h2{font-size:21px}
  .search{width:100%}
}

@media(max-width:350px){
  .categories{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header>
  <div class="logo">LUVIRA JEWELS</div>
  <div class="tagline">EXCLUSIVE JEWELLERY COLLECTION</div>
</header>

<main class="container">

  <h1 class="section-title">Explore Our Collections</h1>

  <div class="categories" id="categories">
    <button class="cat-btn active" data-cat="All Products">ALL</button>
    <button class="cat-btn" data-cat="Rings">RINGS</button>
    <button class="cat-btn" data-cat="Earrings">EARRINGS</button>
    <button class="cat-btn" data-cat="Pendants">PENDANTS</button>
    <button class="cat-btn" data-cat="Necklaces">NECKLACES</button>
    <button class="cat-btn" data-cat="Bracelets">BRACELETS</button>
  </div>

  <div class="toolbar">
    <h2 id="heading">All Products</h2>
    <input
      class="search"
      id="search"
      type="search"
      placeholder="Search product name or code..."
    >
  </div>

  <div id="status" class="status">Loading collections...</div>
  <div class="grid" id="products"></div>

  <div class="pagination" id="pagination" style="display:none">
    <button id="prev">Previous</button>
    <span id="page">Page 1</span>
    <button id="next">Next</button>
  </div>

</main>

<footer>
  LUVIRA JEWELS · EXCLUSIVE JEWELLERY COLLECTION
</footer>

<div class="modal" id="modal">
  <div class="modal-box">
    <span class="close" id="close">&times;</span>
    <h2 id="modal-name"></h2>
    <div id="modal-details"></div>
    <div id="modal-links"></div>
  </div>
</div>

<script>

// GOOGLE SHEETS PUBLISHED DATA

const SHEETS = {
  "Rings":
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTIUK_4obXBbYYtUc-99UspPpgSKowLEJcnCZy7kSfTkYO3QF16MWWWE34nE545rx3obmoloGKsJ9Bz/pub?gid=0&single=true&output=csv",

  "Earrings":
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTIUK_4obXBbYYtUc-99UspPpgSKowLEJcnCZy7kSfTkYO3QF16MWWWE34nE545rx3obmoloGKsJ9Bz/pub?gid=547971000&single=true&output=csv",

  "Pendants":
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTIUK_4obXBbYYtUc-99UspPpgSKowLEJcnCZy7kSfTkYO3QF16MWWWE34nE545rx3obmoloGKsJ9Bz/pub?gid=318107255&single=true&output=csv",

  "Necklaces":
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTIUK_4obXBbYYtUc-99UspPpgSKowLEJcnCZy7kSfTkYO3QF16MWWWE34nE545rx3obmoloGKsJ9Bz/pub?gid=1426609771&single=true&output=csv",

  "Bracelets":
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTIUK_4obXBbYYtUc-99UspPpgSKowLEJcnCZy7kSfTkYO3QF16MWWWE34nE545rx3obmoloGKsJ9Bz/pub?gid=121305611&single=true&output=csv"
};

let allProducts = [];
let currentCategory = "All Products";
let currentPage = 1;
const perPage = 12;

// CSV READER

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;

  for (let i=0; i<text.length; i++) {
    const c = text[i];

    if (c === '"') {
      if (quoted && text[i+1] === '"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (c === ',' && !quoted) {
      row.push(cell);
      cell = "";
    } else if ((c === '\n' || c === '\r') && !quoted) {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cell);
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
      cell = "";
    } else {
      cell += c;
    }
  }

  row.push(cell);
  if (row.some(v => v.trim() !== "")) rows.push(row);

  return rows;
}

// LOAD GOOGLE SHEETS

async function loadProducts() {
  const status = document.getElementById("status");

  try {
    const results = await Promise.all(
      Object.entries(SHEETS).map(async ([category,url]) => {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Unable to load " + category);
        }

        const csv = await response.text();
        const rows = parseCSV(csv);

        return rows.slice(1)
          .filter(r => r[0] && r[0].trim())
          .map(r => ({
            code:r[0] || "",
            name:r[1] || "",
            description:r[2] || "",
            material:r[3] || "",
            metalWeight:r[4] || "",
            diamondWeight:r[5] || "",
            size:r[6] || "",
            imageFolder:r[7] || "",
            videoFolder:r[8] || "",
            category
          }));
      })
    );

    allProducts = results.flat();

    status.style.display = "none";
    renderProducts();

  } catch(error) {
    status.innerHTML =
      "Unable to load products. Please check Google Sheets publishing settings.";
    console.error(error);
  }
}

// DISPLAY PRODUCTS

function renderProducts() {

  const grid = document.getElementById("products");
  const search = document.getElementById("search").value.toLowerCase();

  let filtered = allProducts.filter(p => {
    const categoryMatch =
      currentCategory === "All Products" ||
      p.category === currentCategory;

    const searchMatch =
      (p.name + " " + p.code + " " + p.category)
      .toLowerCase().includes(search);

    return categoryMatch && searchMatch;
  });

  const totalPages = Math.max(1,Math.ceil(filtered.length/perPage));

  currentPage = Math.min(currentPage,totalPages);

  const start = (currentPage-1)*perPage;
  const pageProducts = filtered.slice(start,start+perPage);

  document.getElementById("heading").textContent = currentCategory;

  grid.innerHTML = "";

  if (!filtered.length) {
    grid.innerHTML =
      '<div class="status" style="grid-column:1/-1">No products found.</div>';
  }

  pageProducts.forEach(p => {

    const card = document.createElement("div");
    card.className = "product";

    const image = document.createElement("div");
    image.className = "product-image";

    const placeholder = document.createElement("span");
    placeholder.className = "no-image";
    placeholder.textContent = "LUVIRA JEWELS";
    image.appendChild(placeholder);

    const info = document.createElement("div");
    info.className = "product-info";

    const name = document.createElement("h3");
    name.textContent = p.name;

    const code = document.createElement("p");
    code.textContent = "Product Code: " + p.code;

    const category = document.createElement("p");
    category.className = "category";
    category.textContent = p.category;

    const btn = document.createElement("button");
    btn.className = "view-btn";
    btn.textContent = "View Details";

    btn.addEventListener("click",e => {
      e.stopPropagation();
      openProduct(p);
    });

    info.append(name,code,category,btn);
    card.append(image,info);

    card.addEventListener("click",() => openProduct(p));

    grid.appendChild(card);
  });

  const pagination = document.getElementById("pagination");
  pagination.style.display = filtered.length ? "flex" : "none";

  document.getElementById("page").textContent =
    `Page ${currentPage} of ${totalPages}`;

  document.getElementById("prev").disabled = currentPage === 1;
  document.getElementById("next").disabled = currentPage === totalPages;
}

// PRODUCT DETAILS

function openProduct(p) {

  document.getElementById("modal-name").textContent = p.name;

  const details = document.getElementById("modal-details");

  details.innerHTML = "";

  [
    ["Product Code",p.code],
    ["Category",p.category],
    ["Description",p.description],
    ["Material",p.material],
    ["Metal Weight",p.metalWeight],
    ["Diamond Weight",p.diamondWeight],
    ["Size",p.size]
  ].forEach(([label,value]) => {
    const line = document.createElement("p");
    const strong = document.createElement("strong");
    strong.textContent = label + ": ";
    line.append(strong,document.createTextNode(value || "-"));
    details.appendChild(line);
  });

  const links = document.getElementById("modal-links");
  links.innerHTML = "";

  [
    ["View Product Photos",p.imageFolder],
    ["View Product Videos",p.videoFolder]
  ].forEach(([label,url]) => {

    if (!url) return;

    const a = document.createElement("a");
    a.className = "folder-link";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = label;
    links.appendChild(a);
  });

  document.getElementById("modal").style.display = "block";
}

// CATEGORY FILTER

document.querySelectorAll(".cat-btn").forEach(btn => {

  btn.addEventListener("click",() => {

    document.querySelectorAll(".cat-btn")
      .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");

    currentCategory = btn.dataset.cat;
    currentPage = 1;

    renderProducts();
  });
});

// SEARCH

document.getElementById("search").addEventListener("input",() => {
  currentPage = 1;
  renderProducts();
});

// PAGINATION

document.getElementById("prev").onclick = () => {
  if (currentPage > 1) {
    currentPage--;
    renderProducts();
    window.scrollTo({top:0,behavior:"smooth"});
  }
};

document.getElementById("next").onclick = () => {
  currentPage++;
  renderProducts();
  window.scrollTo({top:0,behavior:"smooth"});
};

// MODAL

document.getElementById("close").onclick = () => {
  document.getElementById("modal").style.display = "none";
};

document.getElementById("modal").onclick = e => {
  if (e.target.id === "modal") {
    document.getElementById("modal").style.display = "none";
  }
};

// START

loadProducts();

</script>
</body>
</html>
