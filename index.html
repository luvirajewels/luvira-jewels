
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171512">

<title>Luvira Jewels | Exclusive Jewellery</title>

<style>
:root {
  --black:#171512;
  --gold:#c8a45d;
  --cream:#faf8f3;
  --text:#29251f;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--cream);
  color:var(--text);
  font-family:Arial,sans-serif;
}

header {
  background:var(--black);
  color:white;
  text-align:center;
  padding:24px 15px;
  border-bottom:3px solid var(--gold);
}

.logo {
  font-family:Georgia,serif;
  font-size:clamp(25px,5vw,38px);
  font-weight:bold;
  letter-spacing:5px;
}

.tagline {
  color:var(--gold);
  font-size:11px;
  letter-spacing:3px;
  margin-top:9px;
}

.container {
  max-width:1400px;
  margin:auto;
  padding:25px 18px;
}

.section-title {
  font-family:Georgia,serif;
  font-size:26px;
  margin:10px 0 22px;
}

.categories {
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
  margin-bottom:25px;
}

.cat-btn {
  background:var(--black);
  color:var(--gold);
  border:1px solid var(--gold);
  padding:20px 8px;
  cursor:pointer;
  font-weight:bold;
  letter-spacing:1px;
  min-height:85px;
}

.cat-btn.active,
.cat-btn:hover {
  background:var(--gold);
  color:var(--black);
}

.toolbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin:25px 0;
  flex-wrap:wrap;
}

.toolbar h2 {
  font-family:Georgia,serif;
  font-size:25px;
  margin:0;
}

.search {
  width:min(100%,320px);
  padding:13px;
  border:1px solid #d8d0c3;
  background:white;
  border-radius:5px;
  font-size:14px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
}

.product {
  background:white;
  border:1px solid #e9e5dc;
  overflow:hidden;
  cursor:pointer;
}

.product-image {
  width:100%;
  aspect-ratio:1/1;
  background:#f5f3ef;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

.product-image img {
  width:100%;
  height:100%;
  object-fit:contain;
  position:absolute;
  inset:0;
}

.no-image {
  color:#a99b83;
  font-family:Georgia,serif;
  font-size:15px;
}

.product-info { padding:13px; }

.product-info h3 {
  font-family:Georgia,serif;
  font-size:17px;
  margin:0 0 8px;
}

.product-info p {
  font-size:12px;
  color:#777;
  margin:5px 0;
}

.product-info .category { color:#a17b36; }

.view-btn {
  display:block;
  width:100%;
  margin-top:12px;
  background:var(--black);
  color:var(--gold);
  border:0;
  padding:11px;
  cursor:pointer;
}

.status {
  text-align:center;
  padding:35px 10px;
  color:#8a795b;
}

.pagination {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  padding:30px 0;
}

.pagination button {
  padding:10px 20px;
  background:var(--black);
  color:var(--gold);
  border:0;
  cursor:pointer;
}

.pagination button:disabled {
  opacity:.35;
  cursor:not-allowed;
}

.modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  background:#000b;
  overflow-y:auto;
  padding:20px;
  -webkit-overflow-scrolling:touch;
}

.modal-box {
  background:white;
  max-width:650px;
  width:100%;
  margin:30px auto;
  padding:25px;
  position:relative;
}

.close {
  position:absolute;
  right:15px;
  top:12px;
  font-size:28px;
  cursor:pointer;
}

.modal h2 {
  font-family:Georgia,serif;
  padding-right:25px;
}

.modal p {
  line-height:1.7;
  font-size:14px;
}

#modal-links img,
#modal-links iframe {
  display:block;
  max-width:100%;
}

footer {
  background:var(--black);
  color:#c7b58e;
  text-align:center;
  padding:25px 10px;
  margin-top:35px;
  font-size:12px;
  letter-spacing:1px;
}

@media(max-width:1000px) {
  .grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .categories { grid-template-columns:repeat(3,minmax(0,1fr)); }
}

@media(max-width:700px) {
  .container { padding:18px 12px; }
  .logo { letter-spacing:3px; }
  .categories { grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .cat-btn { min-height:65px; padding:12px 4px; font-size:11px; }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .product-info { padding:9px; }
  .product-info h3 { font-size:14px; }
  .product-info p { font-size:11px; }
  .toolbar { gap:12px; }
  .toolbar h2 { font-size:21px; }
  .search { width:100%; }
  .modal { padding:10px; }
  .modal-box { margin:10px auto; padding:18px; }
}

@media(max-width:350px) {
  .categories { grid-template-columns:repeat(2,1fr); }
  .grid { gap:7px; }
  .product-info h3 { font-size:12px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">LUVIRA JEWELS</div>
  <div class="tagline">EXCLUSIVE JEWELLERY COLLECTION</div>
</header>

<main class="container">

<h1 class="section-title">Explore Our Collections</h1>

<div class="categories" id="categories">
<button class="cat-btn active" data-cat="All Products">ALL</button>
<button class="cat-btn" data-cat="Rings">RINGS</button>
<button class="cat-btn" data-cat="Earrings">EARRINGS</button>
<button class="cat-btn" data-cat="Pendants">PENDANTS</button>
<button class="cat-btn" data-cat="Necklaces">NECKLACES</button>
<button class="cat-btn" data-cat="Bracelets">BRACELETS</button>
</div>

<div class="toolbar">
<h2 id="heading">All Products</h2>
<input class="search" id="search" type="search"
placeholder="Search product name or code...">
</div>

<div id="status" class="status">Loading collections...</div>
<div class="grid" id="products"></div>

<div class="pagination" id="pagination" style="display:none">
<button id="prev">Previous</button>
<span id="page">Page 1</span>
<button id="next">Next</button>
</div>

</main>

<footer>
LUVIRA JEWELS · EXCLUSIVE JEWELLERY COLLECTION
</footer>

<div class="modal" id="modal">
<div class="modal-box">
<span class="close" id="close">&times;</span>
<h2 id="modal-name"></h2>
<div id="modal-details"></div>
<div id="modal-links"></div>
</div>
</div>

<script>
